id: repo
version: 1
name: Work on a repo
about: Takes issues on one repo to a merged pull request, or an honest no.
whose: ours
needs: [github]
blanks:
  - { id: repo, ask: Which repo?, is: { a: place, connector: github }, best: null }
  - { id: name, ask: What is it called?, is: { a: text }, best: { value: Coding, from: the template } }
  - { id: owner, ask: Who answers for it?, is: { a: person }, best: { value: whoever makes it, from: you } }
  - { id: label, ask: Which label asks it?, is: { a: text }, best: { value: juno, from: the co-worker's name } }
  - { id: perWork, ask: Most it may spend on one piece of work, is: { a: number, unit: dollars }, best: { value: "10", from: the template } }
  - { id: perDay, ask: Most it may spend in a day, is: { a: number, unit: dollars }, best: { value: "40", from: the template } }
  - { id: doer, ask: Which model does the work?, is: { a: model, agent: doer }, best: { value: inherit, from: the workspace } }
  - { id: reviewer, ask: Which model reviews it?, is: { a: model, agent: reviewer }, best: { value: inherit, from: the workspace } }
  - { id: judge, ask: Which model judges what comes in?, is: { a: model, agent: judge }, best: { value: inherit, from: the workspace } }
  - { id: install, ask: How is it installed?, is: { a: text }, best: { value: "", from: the repo } }
  - { id: test, ask: How is it tested?, is: { a: text }, best: { value: "", from: the repo } }
