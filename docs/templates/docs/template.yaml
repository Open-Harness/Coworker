id: docs
version: 1
name: Docs
about: Keeps the docs of a repo true to what the code does, in pull requests a person merges.
whose: ours
needs: [github]
blanks:
  - { id: repo, ask: Which repo?, is: { a: place, connector: github }, best: null }
  - { id: name, ask: What is it called?, is: { a: text }, best: { value: Docs, from: the template } }
  - { id: owner, ask: Who answers for it?, is: { a: person }, best: { value: whoever makes it, from: you } }
  - { id: perWork, ask: Most it may spend on one piece of work, is: { a: number, unit: dollars }, best: { value: "5", from: the template } }
  - { id: perDay, ask: Most it may spend in a day, is: { a: number, unit: dollars }, best: { value: "20", from: the template } }
  - { id: writer, ask: Which model writes the docs?, is: { a: model, agent: writer }, best: { value: inherit, from: the workspace } }
  - { id: reviewer, ask: Which model reads them again?, is: { a: model, agent: reviewer }, best: { value: inherit, from: the workspace } }
  - { id: judge, ask: Which model judges what comes in?, is: { a: model, agent: judge }, best: { value: inherit, from: the workspace } }
